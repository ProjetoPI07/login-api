# Configurea��es do Banco de dados

spring.application.name=back-end

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:teste

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

# Configura��es do JWT

jwt.validity=${JWT_VALIDITY:3600}

# Chave secreta para assinar os tokens (algoritmo HMAC-SHA256)
# REQUISITOS:
#   - Deve estar codificada em Base64
#   - Mínimo de 32 bytes após decodificação (256 bits para HS256)
# ATENÇÃO:
#   - NUNCA use esta chave em produção
#   - Em produção, defina a variável de ambiente JWT_SECRET com uma chave forte
#   - Nunca commite chaves reais no repositório Git
jwt.secret=${JWT_SECRET:}